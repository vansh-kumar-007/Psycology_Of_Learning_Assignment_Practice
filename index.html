<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="description" content="Practise Psychology of Learning with week-wise quizzes, a full test, instant feedback and progress tracking.">
  <title>Psychology of Learning — Study Studio</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f3ee; --surface: #fffefa; --surface-2: #f0eee7;
      --ink: #20251f; --muted: #6b7168; --line: #dedfd5;
      --accent: #315c4c; --accent-strong: #244739; --accent-soft: #e4eee7;
      --gold: #c18b45; --correct: #24734d; --correct-bg: #e6f4eb;
      --wrong: #b33e37; --wrong-bg: #fff0ed; --shadow: 0 14px 36px rgba(31, 42, 32, .07);
      --radius: 22px;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #151b18; --surface: #1d2520; --surface-2: #263029;
      --ink: #f1f3ec; --muted: #adb7ad; --line: #38453b;
      --accent: #9bc5aa; --accent-strong: #b8d8c2; --accent-soft: #293d31;
      --gold: #e1b878; --correct: #9cddb5; --correct-bg: #233a2d;
      --wrong: #ffaaa2; --wrong-bg: #422b29; --shadow: 0 14px 36px rgba(0,0,0,.18);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 100px; }
    body {
      margin: 0; background:
        radial-gradient(ellipse at 8% 0%, rgba(193,139,69,.11), transparent 34rem),
        radial-gradient(ellipse at 100% 16%, rgba(49,92,76,.09), transparent 32rem),
        var(--bg);
      color: var(--ink); font: 16px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh; transition: background .25s ease, color .25s ease;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible + .choice-copy, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .shell { width: min(1120px, 100% - 36px); margin: 0 auto; padding: 22px 0 54px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:34px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:750; letter-spacing:-.035em; }
    .brand-mark { display:grid; place-items:center; width:42px; height:42px; border-radius:14px; background:var(--accent); color:#fff; box-shadow:0 8px 18px rgba(49,92,76,.2); }
    [data-theme="dark"] .brand-mark { color:#172019; }
    .brand-name { font-size:1rem; }
    .brand-sub { display:block; color:var(--muted); font-size:.72rem; font-weight:550; letter-spacing:.07em; text-transform:uppercase; }
    .top-actions { display:flex; align-items:center; gap:9px; }
    .icon-btn,.quiet-btn { border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:13px; min-height:42px; padding:9px 13px; transition:transform .18s, border-color .18s, background .18s; }
    .icon-btn { width:44px; padding:0; font-size:1.1rem; }
    .icon-btn:hover,.quiet-btn:hover { transform:translateY(-1px); border-color:var(--accent); }
    .eyebrow { color:var(--accent); font-size:.76rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    .hero { display:grid; grid-template-columns:1.35fr .65fr; gap:24px; align-items:stretch; margin-bottom:26px; }
    .hero-main { background:var(--accent); color:#fff; border-radius:28px; padding:clamp(25px, 5vw, 48px); position:relative; overflow:hidden; box-shadow:var(--shadow); }
    .hero-main:after { content:""; position:absolute; width:270px; height:270px; border:1px solid rgba(255,255,255,.18); border-radius:50%; right:-90px; top:-95px; box-shadow:0 0 0 28px rgba(255,255,255,.035),0 0 0 60px rgba(255,255,255,.025); pointer-events:none; }
    .hero-main .eyebrow { color:#d8e7db; }
    h1,h2,h3,p { margin-top:0; }
    h1 { font-size:clamp(2.15rem, 5.2vw, 4rem); line-height:1.04; letter-spacing:-.065em; max-width:620px; margin:13px 0 16px; }
    .hero-copy { color:rgba(255,255,255,.78); max-width:510px; margin-bottom:26px; }
    .hero-actions { display:flex; flex-wrap:wrap; gap:10px; }
    .btn { border:1px solid transparent; border-radius:13px; padding:12px 17px; min-height:46px; font-weight:750; transition:transform .18s, box-shadow .18s, background .18s; }
    .btn:hover { transform:translateY(-2px); }
    .btn-light { background:#fffefa; color:#244739; box-shadow:0 7px 18px rgba(0,0,0,.1); }
    .btn-outline-light { background:transparent; border-color:rgba(255,255,255,.36); color:#fff; }
    .btn-primary { background:var(--accent); color:#fff; }
    [data-theme="dark"] .btn-primary { color:#172019; }
    .btn-soft { background:var(--accent-soft); color:var(--accent-strong); }
    .btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }
    .hero-side { background:var(--surface); border:1px solid var(--line); border-radius:28px; padding:25px; display:flex; flex-direction:column; justify-content:space-between; box-shadow:var(--shadow); }
    .stat-label { color:var(--muted); font-size:.84rem; }
    .stat-number { font-size:2.4rem; font-weight:800; letter-spacing:-.06em; line-height:1.1; margin:6px 0; }
    .stat-foot { color:var(--muted); font-size:.8rem; }
    .stat-divider { height:1px; background:var(--line); margin:19px 0; }
    .progress-track { height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin:10px 0 8px; }
    .progress-fill { height:100%; width:0; background:var(--gold); border-radius:inherit; transition:width .35s ease; }
    .section-head { display:flex; justify-content:space-between; align-items:end; gap:18px; margin:34px 0 16px; }
    .section-head h2 { font-size:1.55rem; letter-spacing:-.045em; margin:4px 0 0; }
    .section-head p { color:var(--muted); margin:4px 0 0; font-size:.9rem; }
    .week-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:13px; }
    .week-card { text-align:left; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:19px; padding:18px; min-height:145px; position:relative; overflow:hidden; transition:transform .2s,border-color .2s,box-shadow .2s; }
    .week-card:hover { transform:translateY(-4px); border-color:var(--accent); box-shadow:var(--shadow); }
    .week-card:after { content:"↗"; position:absolute; right:16px; top:15px; color:var(--muted); font-size:1.05rem; }
    .week-num { display:block; color:var(--muted); font-size:.73rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; margin-bottom:16px; }
    .week-title { display:block; font-weight:780; font-size:1rem; letter-spacing:-.025em; padding-right:18px; }
    .week-meta { display:block; color:var(--muted); font-size:.78rem; margin-top:5px; }
    .week-tools { display:flex; align-items:center; gap:10px; margin:0 0 14px; }
    .search-wrap { position:relative; flex:1; min-width:0; }
    .search-wrap .search-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
    .week-search,.week-sort { width:100%; min-height:45px; border:1px solid var(--line); border-radius:13px; background:var(--surface); color:var(--ink); padding:10px 13px; }
    .week-search { padding-left:40px; }
    .week-sort { width:auto; min-width:165px; }
    .week-search:focus,.week-sort:focus { outline:3px solid color-mix(in srgb,var(--gold) 60%,transparent); outline-offset:2px; border-color:var(--accent); }
    .filter-count { color:var(--muted); font-size:.8rem; white-space:nowrap; }
    .performance-panel { margin-top:25px; padding:clamp(19px,3vw,28px); background:var(--surface); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); }
    .performance-head { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:22px; }
    .performance-head h3 { margin:4px 0 5px; font-size:1.25rem; letter-spacing:-.04em; }
    .performance-head p { margin:0; color:var(--muted); font-size:.86rem; }
    .performance-summary { display:flex; gap:9px; flex-wrap:wrap; justify-content:flex-end; }
    .mini-stat { border:1px solid var(--line); border-radius:12px; padding:9px 12px; min-width:86px; }
    .mini-stat strong { display:block; font-size:1.15rem; letter-spacing:-.04em; }
    .mini-stat span { color:var(--muted); font-size:.7rem; }
    .chart-bars { display:grid; gap:13px; }
    .chart-row { display:grid; grid-template-columns:minmax(90px,145px) minmax(60px,1fr) 45px; align-items:center; gap:12px; }
    .chart-label { font-size:.82rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .chart-track { height:12px; background:var(--surface-2); border-radius:999px; overflow:hidden; }
    .chart-fill { height:100%; width:0; border-radius:inherit; background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 58%,var(--gold))); transition:width .7s cubic-bezier(.2,.7,.2,1); }
    .chart-value { text-align:right; font-size:.83rem; font-weight:800; font-variant-numeric:tabular-nums; }
    .chart-footnote { margin:17px 0 0; color:var(--muted); font-size:.76rem; }
    .week-card[hidden] { display:none; }
    .filter-empty { padding:24px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:16px; }
    .practice-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .practice-card { border:1px solid var(--line); background:var(--surface); border-radius:20px; padding:22px; display:flex; gap:16px; align-items:flex-start; transition:transform .2s,border-color .2s; }
    .practice-card:hover { transform:translateY(-2px); border-color:var(--accent); }
    .practice-icon { flex:none; display:grid; place-items:center; width:45px; height:45px; border-radius:14px; background:var(--accent-soft); color:var(--accent); font-size:1.2rem; }
    .practice-card h3 { margin:0 0 5px; font-size:1.05rem; letter-spacing:-.03em; }
    .practice-card p { margin:0 0 15px; color:var(--muted); font-size:.88rem; }
    .text-btn { padding:0; border:0; background:none; color:var(--accent); font-weight:800; }
    .footer { display:flex; justify-content:space-between; gap:14px; margin-top:36px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:.8rem; }
    .quiz-top { position:sticky; top:0; z-index:5; margin:0 calc((100vw - min(1120px, 100vw - 36px))/ -2); padding:12px max(18px, calc((100vw - min(1120px, 100vw - 36px))/2)); background:color-mix(in srgb,var(--bg) 90%,transparent); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); }
    .quiz-top-inner { display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .quiz-title { font-weight:800; letter-spacing:-.03em; }
    .quiz-subtitle { color:var(--muted); font-size:.8rem; }
    .quiz-progress { height:4px; background:var(--surface-2); margin-top:11px; border-radius:999px; overflow:hidden; }
    .quiz-progress > span { display:block; height:100%; background:var(--gold); width:0; transition:width .2s; }
    .quiz-layout { display:grid; grid-template-columns:minmax(0,1fr) 225px; gap:20px; align-items:start; margin-top:24px; }
    .question-card { background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:clamp(19px,3vw,29px); margin-bottom:15px; box-shadow:0 5px 18px rgba(31,42,32,.025); animation:rise .3s ease both; }
    .question-meta { display:flex; align-items:center; justify-content:space-between; gap:10px; color:var(--muted); font-size:.78rem; font-weight:700; margin-bottom:14px; }
    .question-card h3 { font-size:1.13rem; line-height:1.5; letter-spacing:-.025em; margin:0 0 19px; }
    .choice-list { display:grid; gap:9px; }
    .choice { position:relative; display:flex; align-items:flex-start; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:13px; cursor:pointer; transition:border-color .16s,background .16s; }
    .choice:hover { border-color:var(--accent); background:var(--accent-soft); }
    .choice input { position:absolute; opacity:0; width:1px; height:1px; }
    .choice-letter { display:grid; place-items:center; flex:none; width:27px; height:27px; border:1px solid var(--line); border-radius:8px; color:var(--muted); font-size:.78rem; font-weight:800; }
    .choice-copy { flex:1; border-radius:5px; }
    .choice:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); }
    .choice:has(input:checked) .choice-letter { background:var(--accent); border-color:var(--accent); color:white; }
    [data-theme="dark"] .choice:has(input:checked) .choice-letter { color:#172019; }
    .quiz-sidebar { position:sticky; top:95px; background:var(--surface); border:1px solid var(--line); border-radius:19px; padding:17px; }
    .sidebar-label { font-size:.75rem; color:var(--muted); font-weight:800; text-transform:uppercase; letter-spacing:.1em; }
    .question-map { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin:13px 0 18px; }
    .map-btn { border:1px solid var(--line); border-radius:8px; aspect-ratio:1; padding:0; background:var(--surface); color:var(--muted); font-size:.75rem; }
    .map-btn.answered { background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent); font-weight:800; }
    .map-btn.current { outline:2px solid var(--gold); outline-offset:1px; }
    .sidebar-note { font-size:.78rem; color:var(--muted); margin-bottom:13px; }
    .quiz-actions { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:18px 0 0; }
    .quiz-actions .right { display:flex; gap:8px; }
    .result-hero { border-radius:25px; background:var(--accent); color:white; padding:clamp(24px,5vw,42px); margin:28px 0 22px; }
    .result-score { font-size:clamp(3.5rem,10vw,6rem); font-weight:850; line-height:1; letter-spacing:-.08em; margin:12px 0; }
    .result-hero p { color:rgba(255,255,255,.78); margin-bottom:0; }
    .result-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:23px; }
    .result-stat { background:var(--surface); border:1px solid var(--line); border-radius:17px; padding:17px; }
    .result-stat strong { display:block; font-size:1.6rem; letter-spacing:-.05em; }
    .result-stat span { color:var(--muted); font-size:.8rem; }
    .review-card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:19px; margin:11px 0; }
    .review-card h3 { font-size:1rem; margin-bottom:13px; }
    .answer-line { font-size:.9rem; margin:5px 0; }
    .answer-correct { color:var(--correct); font-weight:750; }
    .answer-wrong { color:var(--wrong); font-weight:750; }
    .empty-state { border:1px dashed var(--line); border-radius:18px; padding:30px; text-align:center; color:var(--muted); }
    .toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); opacity:0; pointer-events:none; background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:12px; box-shadow:var(--shadow); z-index:10; transition:opacity .2s,transform .2s; font-size:.88rem; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .hidden { display:none !important; }
    @keyframes rise { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:translateY(0); } }
    @media (max-width:900px) { .week-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } .quiz-layout { grid-template-columns:minmax(0,1fr) 190px; gap:13px; } }
    @media (max-width:680px) {
      .shell { width:min(100% - 26px, 560px); padding-top:14px; }
      .topbar { margin-bottom:23px; }
      .hero { grid-template-columns:1fr; gap:12px; }
      .hero-main { border-radius:23px; }
      .hero-side { border-radius:20px; display:grid; grid-template-columns:1fr 1fr; gap:15px; padding:19px; }
      .hero-side .stat-divider { display:none; }
      .hero-side .stat-block:last-child { grid-column:1/-1; }
      .week-tools { align-items:stretch; flex-wrap:wrap; }
      .week-sort { flex:1; min-width:140px; }
      .filter-count { width:100%; }
      .performance-head { flex-direction:column; }
      .performance-summary { justify-content:flex-start; }
      .chart-row { grid-template-columns:92px minmax(40px,1fr) 38px; gap:8px; }
      .chart-label { font-size:.75rem; }
      .week-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      .week-card { min-height:128px; padding:15px; }
      .practice-grid { grid-template-columns:1fr; }
      .section-head { margin-top:27px; }
      .quiz-top { margin-left:-13px; margin-right:-13px; padding-left:13px; padding-right:13px; }
      .quiz-layout { display:flex; flex-direction:column-reverse; }
      .quiz-main { width:100%; }
      .quiz-sidebar { position:static; width:100%; }
      .question-map { grid-template-columns:repeat(10,1fr); }
      .map-btn { aspect-ratio:1.15; }
      .result-stats { gap:7px; }
      .result-stat { padding:12px; }
      .result-stat strong { font-size:1.35rem; }
      .footer { flex-direction:column; }
    }
    @media (max-width:390px) {
      .brand-sub { display:none; }
      .hero-actions .btn { flex:1; }
      .week-title { font-size:.92rem; }
      .week-meta { font-size:.72rem; }
      .top-actions .quiet-btn { padding:8px 10px; }
      .question-map { grid-template-columns:repeat(7,1fr); }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { scroll-behavior:auto !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand" aria-label="Psychology Study Studio home">
        <div class="brand-mark" aria-hidden="true">ψ</div>
        <div><span class="brand-name">Study Studio</span><span class="brand-sub">Psychology of Learning</span></div>
      </div>

      </div>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer class="footer"><span>Psychology of Learning · Practice at your own pace</span><span>Your answers stay in this browser session.</span></footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

      const submit=document.getElementById('submitBtn'); if(submit)submit.addEventListener('click',confirmSubmit);
      document.getElementById('finishBtn').addEventListener('click',confirmSubmit);
      document.getElementById('quitBtn').addEventListener('click',()=>{if(confirm('Exit this test? Your current answers will be lost.'))home();});
    }
    function renderQuizKeepPosition(){const y=window.scrollY;renderQuiz();window.scrollTo(0,y);}
    function confirmSubmit(){
      const unanswered=cur.length-Object.keys(answers).length;
      const message=unanswered?`You have ${unanswered} unanswered question${unanswered===1?'':'s'}. Submit anyway?`:'Ready to see your results?';
      if(confirm(message))showResults();
    }
    function showResults(){
      mode='results';clearInterval(timerId);
      let score=0;
      cur.forEach((q,n)=>{if(answers[n]===q[2])score++;});
      const pct=Math.round(score/cur.length*100);
      history.completed++;history.attempts++;history.answered+=Object.keys(answers).length;history.best=Math.max(history.best,pct);
      if(selectedWeek>=0){const old=history.weekScores[selectedWeek];if(!old||score/cur.length>old.score/old.total)history.weekScores[selectedWeek]={score,total:cur.length};}
      saveHistory();
      const duration=Math.max(0,Math.round((Date.now()-startedAt)/1000));
      const timeText=`${Math.floor(duration/60)}m ${duration%60}s`;
      const message=pct>=85?'Excellent work — you know this material well.':pct>=65?'Good progress. Review the missed questions to sharpen your recall.':'Every attempt is useful. Review the explanations, then give it another go.';
      const review=cur.map((q,n)=>{
        const picked=answers[n], ok=picked===q[2];
        return `<article class="review-card"><div class="question-meta"><span>Question ${n+1}${q[3]?` · ${esc(q[3])}`:''}</span><span class="${ok?'answer-correct':'answer-wrong'}">${ok?'✓ Correct':picked===undefined?'— Skipped':'✕ Incorrect'}</span></div><h3>${esc(q[0])}</h3><div class="answer-line ${ok?'answer-correct':'answer-wrong'}">Your answer: ${picked===undefined?'Not answered':esc(q[1][picked])}</div>${!ok?`<div class="answer-line answer-correct">Correct answer: ${esc(q[1][q[2]])}</div>`:''}</article>`;
      }).join('');
      app.innerHTML=`<section class="result-hero"><div class="eyebrow" style="color:#d8e7db">Test complete</div><div class="result-score">${pct}%</div><h1 style="font-size:clamp(1.6rem,4vw,2.3rem);letter-spacing:-.05em;margin:0 0 10px">${score} out of ${cur.length} correct</h1><p>${message}</p></section>
        <div class="result-stats"><div class="result-stat"><strong>${score}</strong><span>Correct answers</span></div><div class="result-stat"><strong>${cur.length-score}</strong><span>To review</span></div><div class="result-stat"><strong>${timeText}</strong><span>Time taken</span></div></div>
        <div class="hero-actions" style="margin-bottom:26px"><button class="btn btn-primary" id="retryBtn" type="button">Try again ↻</button><button class="btn btn-soft" id="homeResultsBtn" type="button">Back to all tests</button><button class="btn btn-soft" id="printBtn" type="button">Print results</button></div>
        <div class="section-head"><div><div class="eyebrow">Learn from every attempt</div><h2>Answer review</h2><p>Incorrect and skipped questions include the correct answer.</p></div></div>${review}`;
      document.getElementById('retryBtn').addEventListener('click',()=>start(selectedWeek));
      document.getElementById('homeResultsBtn').addEventListener('click',home);
      document.getElementById('printBtn').addEventListener('click',()=>window.print());
      goTop();
    }
    document.getElementById('homeBtn').addEventListener('click',home);
    const themeBtn=document.getElementById('themeBtn');
    function setTheme(theme){document.documentElement.dataset.theme=theme;themeBtn.textContent=theme==='dark'?'☀':'☾';themeBtn.setAttribute('aria-label',theme==='dark'?'Switch to light theme':'Switch to dark theme');try{localStorage.setItem('psychology-theme',theme);}catch(e){}}
    themeBtn.addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
    try{const savedTheme=localStorage.getItem('psychology-theme');if(savedTheme==='dark'||savedTheme==='light')setTheme(savedTheme);}catch(e){}
    document.addEventListener('keydown',e=>{
      if(mode!=='quiz'||e.altKey||e.ctrlKey||e.metaKey)return;
      if(e.key==='ArrowRight'&&currentQuestion<cur.length-1){currentQuestion++;renderQuiz();}
      if(e.key==='ArrowLeft'&&currentQuestion>0){currentQuestion--;renderQuiz();}
    });
    home();
  </script>
  <style>
    @media print {
      body { background:#fff; color:#111; }
      .topbar,.footer,.hero-actions,.quiz-top,.quiz-sidebar,.quiz-actions,#homeResultsBtn,#retryBtn,#printBtn { display:none !important; }
      .shell { width:100%; padding:0; }
      .review-card,.result-hero,.result-stat { break-inside:avoid; box-shadow:none; }
      .result-hero { background:#eee; color:#111; }
      .result-hero p { color:#333; }
    }
  </style>
</body>
</html>
